name: Deploy Vue Application

on:
  push: 
    branches:
      - main
      - feat/base-ui
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4 
      - name: Create .env file
        run: |
            echo "NEXT_PUBLIC_SERVER_URL=${{secrets.NEXT_PUBLIC_SERVER_URL}}" >> .env
            echo "HOSTNAME=${{secrets.HOSTNAME}}" >> .env
            echo "PORT=${{secrets.PORT}}" >> .env

      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}       
      - name: Build docker image
        run: docker build -t duymt3/happyboard-cms .  
      - name: Publish image to docker hub
        run: docker push duymt3/happyboard-cms:latest
        
